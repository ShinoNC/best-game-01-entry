<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIDEKEEPER — Hold the Reef</title>
<style>
  @font-face { font-family: 'Press Start 2P'; src: url('assets/fonts/press-start-2p-latin.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'VT323'; src: url('assets/fonts/vt323-latin.woff2') format('woff2'); font-display: swap; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #062a33; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="TIDEKEEPER: a hermit crab defends the reef through endless stages and drives off the sea beasts"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
